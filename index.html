<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dinner Invitation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f7f3ed;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .card {
      width: 90%;
      max-width: 390px;
      background: white;
      padding: 40px 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,0.12);
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    h2 {
      font-size: 23px;
      margin-bottom: 25px;
    }

    p {
      font-size: 18px;
      line-height: 1.9;
      margin: 8px 0;
    }

    .question {
      margin-top: 30px;
      font-size: 20px;
      font-weight: bold;
    }

    .buttons {
      margin-top: 25px;
      height: 70px;
      position: relative;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 14px 30px;
      font-size: 18px;
      cursor: pointer;
    }

    #yes {
      background: #222;
      color: white;
    }

    #no {
      background: #e5e5e5;
      color: #222;
      position: fixed;
    }

    #success {
      display: none;
      font-size: 24px;
      font-weight: bold;
      line-height: 1.7;
    }
  </style>
</head>

<body>

  <div class="card" id="invitation">

    <h1>دعوة عشاء</h1>

    <h2>رحاب</h2>

    <p>يسعدني دعوتك للعشاء</p>

    <p><strong>9 سبتمبر 2026</strong></p>

    <p><strong>9:00 مساءً</strong></p>

    <p>Four Seasons Riyadh</p>

    <div class="question">
      هل تقبلين الدعوة؟
    </div>

    <div class="buttons">
      <button id="yes">YES</button>
      <button id="no">NO</button>
    </div>

  </div>

  <div class="card" id="success">
    تم تأكيد الموعد<br><br>
    أشوفك 9 سبتمبر الساعة 9 مساءً
  </div>

<script>

const noButton = document.getElementById("no");
const yesButton = document.getElementById("yes");

function moveNo() {

  const padding = 20;

  const maxX =
    window.innerWidth -
    noButton.offsetWidth -
    padding;

  const maxY =
    window.innerHeight -
    noButton.offsetHeight -
    padding;

  const x =
    Math.max(padding, Math.random() * maxX);

  const y =
    Math.max(padding, Math.random() * maxY);

  noButton.style.left = x + "px";
  noButton.style.top = y + "px";
}

noButton.addEventListener("touchstart", function(e) {
  e.preventDefault();
  moveNo();
});

noButton.addEventListener("mouseenter", moveNo);

noButton.addEventListener("click", function(e) {
  e.preventDefault();
  moveNo();
});

yesButton.addEventListener("click", function() {

  document.getElementById("invitation").style.display = "none";
  noButton.style.display = "none";
  document.getElementById("success").style.display = "block";

});

window.onload = function() {
  const rect = noButton.getBoundingClientRect();
  noButton.style.left = (window.innerWidth / 2 + 45) + "px";
  noButton.style.top = rect.top + "px";
};

</script>

</body>
</html>
